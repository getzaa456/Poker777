<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker777 — Lobby</title>

<!-- Playful rounded display font + clean rounded body font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lobby.css">
<link rel="stylesheet" href="css/glassmorphism-button.css">
</head>
<body>

<div class="app-background" id="appBackground">

  <!-- หมอกออร่าไอแสงเนบิวลา Ambient Glows -->
  <div class="cloud" style="width:280px;height:280px;top:5%;left:5%;"></div>
  <div class="cloud" style="width:220px;height:220px;top:10%;left:70%;"></div>
  <div class="cloud" style="width:320px;height:320px;top:2%;left:35%;"></div>

  <div class="castle-silhouette"></div>

  <!-- Glass Casino Chips สัญลักษณ์ไพ่เรืองแสง (♠ ♥ ♣ ♦) -->
  <div class="balloon" data-suit="♠" style="--b-glow:rgba(95,208,232,0.6); width:56px;height:56px; top:12%;left:26%;animation-delay:0s;"></div>
  <div class="balloon" data-suit="♥" style="--b-glow:rgba(255,95,162,0.6); width:48px;height:48px; top:8%;left:36%;animation-delay:.6s;"></div>
  <div class="balloon" data-suit="♣" style="--b-glow:rgba(217,139,224,0.6); width:58px;height:58px; top:7%;right:15%;animation-delay:.3s;"></div>
  <div class="balloon" data-suit="♦" style="--b-glow:rgba(255,209,102,0.6); width:50px;height:50px; top:13%;right:8%;animation-delay:.9s;"></div>
  <div class="balloon" data-suit="♠" style="--b-glow:rgba(139,110,247,0.6); width:52px;height:52px; top:17%;right:22%;animation-delay:1.2s;"></div>

  <!-- Sparkling Dust particles -->
  <div class="confetti" style="color:#ffd166;top:10%;left:20%;animation-delay:0s;"></div>
  <div class="confetti" style="color:#ff5fa2;top:15%;left:60%;animation-delay:1s;"></div>
  <div class="confetti" style="color:#5fd0e8;top:8%;left:78%;animation-delay:2s;"></div>
  <div class="confetti" style="color:#8b6ef7;top:20%;left:40%;animation-delay:1.5s;"></div>

  <!-- ======================= HEADER: PLAYER WIDGET ======================= -->
    <header class="profile-widget" id="profileWidget">
      <div class="avatar avatar-svg" id="headerAvatar" role="img" aria-label="Player Avatar"></div>
      <div class="profile-info">
        <div class="profile-name" id="headerName">Loading…</div>
        <div class="profile-chips" id="profileChips">🪙 –</div>
        <div class="xp-bar"><div class="xp-fill"></div></div>
      </div>
      <button class="expand-btn" id="expandBtn" title="View profile">+</button>
          <button class="topup-quick-btn" id="topupQuickBtn" title="Top up chips">🪙+</button>
          <button class="expand-btn logout-btn" id="logoutBtn" title="Log out">⎋</button>
        </header>

  <!-- ======================= PROFILE PANEL (MODAL CARD) ======================= -->
  <section class="profile-panel" id="profilePanel">
    <button class="close-btn" id="closeBtn">✕</button>

    <div class="avatar-picker">
      <div class="avatar-picker-banner"></div>
      <div class="avatar-picker-body">
        <div class="avatar-main-frame">
          <div class="avatar-main" id="mainAvatar" aria-hidden="true"></div>
        </div>

        <div class="avatar-picker-identity">
                  <h2 class="panel-name" id="panelName">Loading…</h2>
                  <p class="avatar-picker-hint">Select your avatar</p>
                  <div class="panel-meta">
                    <span class="level-chip">Lv. 1</span>
                    <span class="title-badge">Rookie</span>
                  </div>
                  <div class="rank-points" id="panelChips">🪙 –</div>
                </div>

        <div class="avatar-choices" id="avatarChoices"></div>
      </div>
    </div>

    <!-- Stats -->
    <div class="section-label">◆ Stats ◆</div>
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-label">Win / Loss</div>
        <div class="stat-value"><span class="win">123</span> / <span class="loss">87</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">Win Rate</div>
        <div class="stat-value">58.6%</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total Chips Won</div>
        <div class="stat-value">🪙 2.45M</div>
      </div>
    </div>

    <!-- Transaction History (from API) -->
    <div class="section-label">◆ Transaction History ◆</div>
    <div id="txList" class="tx-list"></div>
    <button class="tx-load-more" id="txLoadMore" style="display:none;">Load more</button>

    <!-- Top-up button -->
    <button class="glass-cta glass-cta-full glass-cta-gold" id="topupBtn" style="margin-top: 14px;">
      <div class="glass-cta-cutout"></div>
      <div class="glass-cta-content">
        <div class="glass-cta-inner-bg"></div>
        <span class="glass-cta-label">🪙 Top Up Chips</span>
      </div>
    </button>

        <button class="glass-cta glass-cta-full glass-cta-gold" id="confirmAvatarBtn" style="margin-top: 14px;">
      <div class="glass-cta-cutout"></div>
      <div class="glass-cta-content">
        <div class="glass-cta-inner-bg"></div>
        <span class="glass-cta-label">Confirm Avatar</span>
      </div>
    </button>
  </section>

  <!-- ======================= LOGO ======================= -->
  <div class="logo-section">
    <img src="images/logo.png" alt="Poker Logo" class="animated-logo">
  </div>

  <!-- ======================= MAIN ACTION BUTTONS ======================= -->
  <div class="action-buttons">
    <button class="glass-cta glass-cta-lobby glass-cta-pink" onclick="window.location.href='poker-table.html'">
      <div class="glass-cta-shimmer-wrap">
        <div class="glass-cta-shimmer-inner">
          <div class="glass-cta-shimmer-conic"></div>
        </div>
      </div>
      <div class="glass-cta-cutout"></div>
      <div class="glass-cta-content">
        <div class="glass-cta-border-beam"></div>
        <div class="glass-cta-inner-bg"></div>
        <div class="glass-cta-text-group">
          <span class="glass-cta-label">CREATE ROOM</span>
          <span class="glass-cta-sub">Be the host and invite friends!</span>
        </div>
      </div>
    </button>

    <button class="glass-cta glass-cta-lobby glass-cta-cyan" onclick="window.location.href='poker-table.html'">
      <div class="glass-cta-shimmer-wrap">
        <div class="glass-cta-shimmer-inner">
          <div class="glass-cta-shimmer-conic"></div>
        </div>
      </div>
      <div class="glass-cta-cutout"></div>
      <div class="glass-cta-content">
        <div class="glass-cta-border-beam"></div>
        <div class="glass-cta-inner-bg"></div>
        <div class="glass-cta-text-group">
          <span class="glass-cta-label">JOIN ROOM</span>
          <span class="glass-cta-sub">Join a room with friends!</span>
        </div>
      </div>
    </button>
  </div>

  <!-- ======================= ROOM CODE ENTRY ======================= -->
    <div class="room-code-bar">
    <input type="text" id="roomCodeInput" placeholder="Enter Room Code">
    <button class="glass-cta glass-cta-sm glass-cta-purple" onclick="const code = document.getElementById('roomCodeInput').value; if(code.trim()){ window.location.href='poker-table.html'; } else { alert('Please enter a room code'); }">
      <div class="glass-cta-cutout"></div>
      <div class="glass-cta-content">
        <div class="glass-cta-inner-bg"></div>
        <span class="glass-cta-label">Join</span>
      </div>
    </button>
  </div>

  <!-- ======================= TOPUP MODAL ======================= -->
  <div class="modal-overlay" id="topupModal">
    <div class="modal-card">
      <button class="modal-close" id="topupCloseBtn">✕</button>
      <div class="modal-title">🪙 Top Up Chips</div>
      <div class="modal-balance">Current Balance: <span id="topupCurrentBalance">–</span></div>
      <div class="topup-presets" id="topupPresets">
        <button class="topup-preset" data-amount="100">🪙 100</button>
        <button class="topup-preset" data-amount="500">🪙 500</button>
        <button class="topup-preset" data-amount="1000">🪙 1,000</button>
        <button class="topup-preset" data-amount="5000">🪙 5,000</button>
        <button class="topup-preset" data-amount="10000">🪙 10,000</button>
        <button class="topup-preset" data-amount="50000">🪙 50,000</button>
      </div>
      <div class="topup-custom">
        <input type="number" id="topupAmount" placeholder="Custom amount" min="1" max="100000">
        <button class="topup-confirm-btn" id="topupConfirmBtn">Top Up</button>
      </div>
      <div class="topup-message" id="topupMessage"></div>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/avatar-picker.js"></script>
<script>
  // ===================== AUTH GUARD + PROFILE LOAD =====================
  let currentUser = null;

  (async function initLobby() {
    currentUser = await PokerAPI.Auth.requireUser();
    if (!currentUser) return; // redirected to login

    // Fill names
    const displayName = currentUser.display_name || currentUser.username;
    document.getElementById('headerName').textContent = displayName;
    document.getElementById('panelName').textContent = displayName;

    // Fill chips (wallet balance from /users/me)
    const chipsText = '🪙 ' + PokerAPI.fmtChips(currentUser.balance);
    document.getElementById('profileChips').textContent = chipsText;
    document.getElementById('panelChips').textContent = chipsText;

    // Init avatar picker: server-side avatar_id wins over local storage.
    initAvatarPicker({
      headerId: 'headerAvatar',
      mainId: 'mainAvatar',
      choicesId: 'avatarChoices',
      initialId: currentUser.avatar_id ? parseInt(currentUser.avatar_id, 10) : null,
    });
  })();

  // ===================== PROFILE PANEL TOGGLE =====================
  const widget = document.getElementById('profileWidget');
  const panel  = document.getElementById('profilePanel');
  const closeBtn = document.getElementById('closeBtn');
  const confirmAvatarBtn = document.getElementById('confirmAvatarBtn');

  function closeProfilePanel() {
    panel.classList.remove('open');
  }

  widget.addEventListener('click', () => panel.classList.add('open'));
  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeProfilePanel();
  });

  // ===================== CONFIRM AVATAR -> PATCH /users/me =====================
  confirmAvatarBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const label = confirmAvatarBtn.querySelector('.glass-cta-label');
    const original = label.textContent;
    try {
      label.textContent = 'Saving…';
      confirmAvatarBtn.disabled = true;
      const avatarId = window.avatarPicker.getSelectedId();
      currentUser = await PokerAPI.Auth.updateMe({ avatar_id: String(avatarId) });
      label.textContent = 'Saved ✓';
      setTimeout(() => closeProfilePanel(), 600);
    } catch (err) {
      label.textContent = 'Failed';
      setTimeout(() => { label.textContent = original; }, 1200);
      if (err.code === 'NETWORK') alert(err.message);
    } finally {
      confirmAvatarBtn.disabled = false;
    }
  });

  // ===================== LOGOUT =====================
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      PokerAPI.Auth.logout();
    });
  }

  panel.classList.remove('open');

  // ===================== TRANSACTION HISTORY =====================
  const txList = document.getElementById('txList');
  const txLoadMore = document.getElementById('txLoadMore');
  let txPage = 1;
  let txHasMore = false;

  async function loadTransactions(page = 1) {
    try {
      const data = await PokerAPI.Wallet.transactions(page, 10);
      const txns = data.transactions || [];
      txHasMore = data.pagination ? data.pagination.page < data.pagination.totalPages : false;

      if (page === 1) txList.innerHTML = '';

      if (txns.length === 0 && page === 1) {
        txList.innerHTML = '<div class="tx-empty">No transactions yet</div>';
        txLoadMore.style.display = 'none';
        return;
      }

      for (const tx of txns) {
        const isPos = tx.amount > 0;
        const sign = isPos ? '+' : '';
        const cls = isPos ? 'pos' : 'neg';
        const typeLabel = tx.type === 'TOPUP' ? '💰 Top Up' :
                          tx.type === 'BONUS' ? '🎁 Bonus' :
                          tx.type === 'WIN' ? '🏆 Win' :
                          tx.type === 'LOSS' ? '❌ Loss' :
                          tx.type === 'BUYIN' ? '🎫 Buy-in' :
                          tx.type === 'SETTLE' ? '⚖️ Settle' : tx.type;
        const d = new Date(tx.created_at);
        const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const row = document.createElement('div');
        row.className = 'tx-row';
        row.innerHTML = `
          <div class="tx-type">${typeLabel}</div>
          <div class="tx-amount ${cls}">${sign}${PokerAPI.fmtChips(tx.amount)}</div>
          <div class="tx-balance">Bal: ${PokerAPI.fmtChips(tx.balance_after)}</div>
          <div class="tx-time">${timeStr}</div>
        `;
        txList.appendChild(row);
      }

      txLoadMore.style.display = txHasMore ? '' : 'none';
    } catch (err) {
      txList.innerHTML = '<div class="tx-empty">Failed to load transactions</div>';
    }
  }

  txLoadMore.addEventListener('click', () => {
    txPage++;
    loadTransactions(txPage);
  });

  // ===================== TOPUP MODAL =====================
  const topupModal = document.getElementById('topupModal');
  const topupQuickBtn = document.getElementById('topupQuickBtn');
  const topupBtn = document.getElementById('topupBtn');
  const topupCloseBtn = document.getElementById('topupCloseBtn');
  const topupCurrentBalance = document.getElementById('topupCurrentBalance');
  const topupAmount = document.getElementById('topupAmount');
  const topupConfirmBtn = document.getElementById('topupConfirmBtn');
  const topupMessage = document.getElementById('topupMessage');
  const topupPresets = document.getElementById('topupPresets');

  function openTopupModal() {
    topupCurrentBalance.textContent = '🪙 ' + PokerAPI.fmtChips(currentUser.balance);
    topupAmount.value = '';
    topupMessage.textContent = '';
    topupMessage.className = 'topup-message';
    topupModal.classList.add('open');
  }

  function closeTopupModal() {
    topupModal.classList.remove('open');
  }

  topupQuickBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openTopupModal();
  });

  topupBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openTopupModal();
  });

  topupCloseBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeTopupModal();
  });

  topupModal.addEventListener('click', (e) => {
    if (e.target === topupModal) closeTopupModal();
  });

  // Preset buttons
  topupPresets.addEventListener('click', (e) => {
    const btn = e.target.closest('.topup-preset');
    if (!btn) return;
    topupAmount.value = btn.dataset.amount;
    doTopup();
  });

  topupConfirmBtn.addEventListener('click', () => doTopup());

  topupAmount.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doTopup();
  });

  async function doTopup() {
    const amt = parseInt(topupAmount.value, 10);
    if (!amt || amt < 1) {
      topupMessage.textContent = '⚠️ Please enter a valid amount';
      topupMessage.className = 'topup-message error';
      return;
    }
    topupConfirmBtn.disabled = true;
    topupMessage.textContent = 'Processing…';
    topupMessage.className = 'topup-message';

    try {
      const result = await PokerAPI.Wallet.topUp(amt);
      topupMessage.textContent = `✅ Topped up ${PokerAPI.fmtChips(result.amount)} chips!`;
      topupMessage.className = 'topup-message success';

      // Update balance everywhere
      currentUser.balance = result.balance;
      const chipsText = '🪙 ' + PokerAPI.fmtChips(result.balance);
      document.getElementById('profileChips').textContent = chipsText;
      document.getElementById('panelChips').textContent = chipsText;
      topupCurrentBalance.textContent = '🪙 ' + PokerAPI.fmtChips(result.balance);

      // Refresh transactions
      txPage = 1;
      loadTransactions(1);

      setTimeout(closeTopupModal, 1200);
    } catch (err) {
      topupMessage.textContent = '❌ ' + (err.message || 'Top up failed');
      topupMessage.className = 'topup-message error';
    } finally {
      topupConfirmBtn.disabled = false;
    }
  }

  // Load transactions when panel opens
  const origWidgetClick = () => {
    txPage = 1;
    loadTransactions(1);
  };
  widget.addEventListener('click', origWidgetClick);
</script>

<!-- Dynamic Delaunay Triangulation Lattice Background -->
<script src="js/lattice-background.js"></script>
<script>
  initLatticeBackground({
    strokeRGB: "139, 110, 247", // Cyber violet (#8b6ef7)
    accentRGB: "79, 179, 255",  // Electric neon cyan/blue (#4fb3ff)
    maxDistance: 140,
    transparent: true,
    zIndex: 1
  });
</script>

</body>
</html>

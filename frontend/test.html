<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker UI Testing Container</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #120924;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .poker-table-container {
            width: 850px;
            background-color: #1a1033;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .join-room-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            width: min(850px, calc(100% - 40px));
            margin-bottom: 20px;
        }

        .room-code-input,
        .join-room-button {
            border: none;
            border-radius: 8px;
            font-size: 14px;
            padding: 10px 14px;
        }

        .room-code-input {
            flex: 1;
            background-color: #0d0718;
            color: #ffffff;
            border: 1px solid #3d2b63;
        }

        .join-room-button {
            background-color: #35c48a;
            color: #ffffff;
            cursor: pointer;
            font-weight: bold;
        }

        .leave-room-button {
            background-color: #d94c5d;
        }

        .join-room-button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* ส่วนแสดงสถานะโต๊ะ/เกม */
        .game-status-bar {
            display: flex;
            gap: 20px;
            background-color: #0d0718;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            color: #a594c7;
            border: 1px solid #2a1b4e;
        }

        .game-status-bar span {
            color: #ffffff;
            font-weight: bold;
        }

        /* 1. ช่องว่างสำหรับแสดง Pot */
        .pot-container {
            background-color: #0d0718;
            border: 2px dashed #332454;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #d6bbfb;
            display: flex;
            gap: 10px;
            min-width: 150px;
            min-height: 40px;
            justify-content: center;
            align-items: center;
        }

        /* 2. ช่องว่างสำหรับแสดงไพ่กลางโต๊ะ (Community Cards) */
        .community-cards-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .cards-row {
            display: flex;
            gap: 10px;
            min-height: 70px;
            padding: 5px;
            border: 1px dashed #332454;
            border-radius: 8px;
            min-width: 290px;
            justify-content: center;
            align-items: center;
        }

        /* 3. จัดวางส่วนผู้เล่น 4 คน (Grid 2x2) */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }

        .player-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #231640;
            padding: 10px 15px;
            border-radius: 15px;
            border: 1px dashed #3d2b63;
            min-height: 74px;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-placeholder {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #2a1b4e;
            border: 2px dashed #6b52ff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 80px;
        }

        .player-name {
            font-weight: bold;
            font-size: 13px;
            min-height: 16px;
        }

        .player-chips {
            color: #ffb800;
            font-size: 12px;
            font-weight: bold;
            min-height: 15px;
        }

        .hole-cards {
            display: flex;
            gap: 5px;
            min-width: 90px;
            min-height: 60px;
            border: 1px dashed #332454;
            border-radius: 6px;
            align-items: center;
            justify-content: center;
        }

        /* 4. ส่วนปุ่มควบคุม */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            width: 100%;
        }

        .bet-adjuster {
            display: flex;
            align-items: center;
            background-color: #23193e;
            border-radius: 8px;
            padding: 4px;
            gap: 8px;
        }

        .btn-step {
            background-color: #312356;
            color: #a594c7;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .btn-step:hover {
            background-color: #433072;
            color: #ffffff;
        }

        .bet-amount {
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            min-width: 60px;
            text-align: center;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            width: 90px;
            height: 60px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-transform: uppercase;
            transition: transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-fold {
            background-color: #3b3154;
        }

        .btn-check {
            background-color: #6b52ff;
        }

        .btn-call {
            background-color: #6b52ff;
        }

        .btn-bet {
            background-color: #ff8a00;
        }

        .btn-raise {
            background-color: #ff3366;
        }
    </style>
</head>

<body>
    <div class="join-room-controls">
        <input type="text" id="room-code-input" class="room-code-input" placeholder="Enter room code"
            aria-label="Room code">
        <button type="button" id="join-room-button" class="join-room-button">JOIN ROOM</button>
        <button type="button" id="leave-room-button" class="join-room-button leave-room-button">LEAVE ROOM</button>
        <button type="button" id="start-game-button" class="join-room-button">START GAME</button>
    </div>

    <div class="poker-table-container">

        <!-- แถบแสดงข้อมูลสถานะเกม / Seat / Status -->
        <div class="game-status-bar">
            <div>Room ID: <span id="room-id">-</span></div>
            <div>Game Started: <span id="game-start">-</span></div>
            <div>Seat: <span id="seat-number-display">-</span></div>
            <div>Turn: <span id="current-turn-display">-</span></div>
            <div>Status: <span id="player-status-display">-</span></div>
        </div>

        <!-- ช่องว่างสำหรับ Pot -->
        <div class="pot-container">
            <span>POT:</span>
            <span class="pot-amount" id="pot-display"></span>
        </div>

        <!-- ช่องว่างสำหรับไพ่กลางโต๊ะ (Community Cards) -->
        <div class="community-cards-container">
            <div class="cards-row" id="community-cards"></div>
        </div>

        <!-- ช่องว่างสำหรับผู้เล่น 4 คน -->
        <div class="players-grid" id="players-grid"></div>


        <!-- แผงปุ่มกดทดสอบ -->
        <div class="controls-wrapper">
            <div class="bet-adjuster">
                <input type="button" id="btn-minus" class="btn-step" value="-">
                <span class="bet-amount" id="bet-value"></span>
                <input type="button" id="btn-plus" class="btn-step" value="+">
            </div>

            <div class="action-buttons">
                <button id="btn-fold" class="btn-action btn-fold">
                    <span>✕</span>
                    <span>FOLD</span>
                </button>

                <button id="btn-check" class="btn-action btn-check">
                    <span>✓</span>
                    <span>CHECK</span>
                </button>

                <button id="btn-call" class="btn-action btn-call">
                    <span>CALL</span>
                    <span id="call-amount"></span>
                </button>

                <button id="btn-bet" class="btn-action btn-bet">
                    <span>BET</span>
                    <span id="bet-amount-text"></span>
                </button>

                <button id="btn-raise" class="btn-action btn-raise">
                    <span>RAISE TO</span>
                    <span id="raise-amount"></span>
                </button>
            </div>
        </div>

    </div>

    <script>
        let currentBet = 100;
        let stepAmount = 50;
        let pot = 0;
        let currentTurnTotalBet = 0;
        let gameStarted = false;
        let roomId = null;
        let roomName = null;
        let hostId = null;
        let playerNum = null;
        let maxPlayer = null;
        let currentPlayers = [];
        let user = null;
        try {
            user = JSON.parse(localStorage.getItem("poker777_user") || "null");
        } catch (error) {
            console.warn("Invalid poker777_user data in localStorage.");
        }
        let socket = null;
        let currentTurnPlayer = null;
        let token = localStorage.getItem("poker777_token");
        let communityCards = [];
        let turnDeadline = null;

        async function refreshAccountBalance() {
            if (!token) {
                return Number(user?.balance ?? user?.money ?? user?.chips ?? 0);
            }

            const apiBase = `${window.location.protocol}//${window.location.hostname}:4000`;
            const response = await fetch(`${apiBase}/users/me`, {
                headers: { Authorization: `Bearer ${token}` }
            });

            if (!response.ok) {
                throw new Error('Unable to load the latest account balance.');
            }

            const data = await response.json();
            user = data.user || user;
            localStorage.setItem('poker777_user', JSON.stringify(user));
            return Number(user?.balance ?? 0);
        }

        const roomCodeFromUrl = new URLSearchParams(window.location.search).get('code');
        const roomCodeInput = document.getElementById('room-code-input');

        if (roomCodeFromUrl && roomCodeInput) {
            roomCodeInput.value = roomCodeFromUrl;
            window.setTimeout(() => {
                if (user?.id && token) {
                    joinRoom();
                }
            }, 150);
        }

        // DOM generation

        function generatePlayerDiv(playerNumber) {
            const playerSection = document.createElement('div');
            playerSection.className = 'player-section';
            playerSection.id = `player-section-${playerNumber}`;
            playerSection.innerHTML = `
                <div class="profile-box">
                    <div class="avatar-placeholder" id="p${playerNumber}-avatar-container"></div>
                    <div class="player-info">
                        <span class="player-name" id="p${playerNumber}-name"></span>
                        <span class="player-chips" id="p${playerNumber}-chips"></span>
                    </div>
                </div>
                <div class="hole-cards" id="p${playerNumber}-hole-cards">
                    <div class="showdown-cards" id="p${playerNumber}-showdown-cards"></div>
                </div>
            `;
            return playerSection;
        }

        function generatePlayerDivs(playerCount = 4) {
            const playersGrid = document.getElementById('players-grid');
            if (!playersGrid) {
                return;
            }

            playersGrid.replaceChildren();
            for (let playerNumber = 1; playerNumber <= playerCount; playerNumber += 1) {
                playersGrid.appendChild(generatePlayerDiv(playerNumber));
            }
        }

        generatePlayerDivs();

        function generateWinnerNotification(winnerId) {
            const winner = currentPlayers.find((player) =>
                String(player.clientId) === String(winnerId)
            );
            const winnerName = winner?.username || winnerId;
            const notificationId = 'winner-notification';
            const existingNotification = document.getElementById(notificationId);

            if (existingNotification) {
                existingNotification.remove();
            }

            const notification = document.createElement('div');
            notification.id = notificationId;
            notification.setAttribute('role', 'status');
            notification.setAttribute('aria-live', 'polite');
            notification.textContent = `Winner: ${winnerName}`;
            Object.assign(notification.style, {
                position: 'fixed',
                top: '24px',
                left: '50%',
                transform: 'translateX(-50%)',
                zIndex: '1000',
                padding: '14px 24px',
                border: '1px solid #ffb800',
                borderRadius: '10px',
                backgroundColor: '#231640',
                color: '#ffffff',
                boxShadow: '0 8px 24px rgba(0, 0, 0, 0.45)',
                fontSize: '18px',
                fontWeight: 'bold',
                textAlign: 'center',
                whiteSpace: 'nowrap'
            });

            document.body.appendChild(notification);
            window.setTimeout(() => notification.remove(), 5000);
        }

        // ------------- Helper function -------------

        function checkNoNullParams(params) {
            if (!params) return false;
            let isValid = true;
            Object.keys(params).forEach((key) => {
                if (params[key] === undefined) {
                    isValid = false;
                }
            });
            return isValid;
        }

        function playerConstructor(clientId, seat, username, chips, holeCards = [], status = "", avatarUrl = "") {
            return {
                clientId: clientId,
                seat: seat,
                username: username,
                chips: chips,
                bettedChips: 0,
                holeCards: holeCards,
                status: status, // "playing" | "folded"
                avatarUrl: avatarUrl
            };
        }

        function setPlayerObjectAttributes(player, attributes) {
            if (!player || !attributes) {
                return player;
            }

            const playerAttributeNames = [
                'clientId',
                'seat',
                'username',
                'chips',
                'bettedChips',
                'holeCards',
                'status',
                'avatarUrl'
            ];

            playerAttributeNames.forEach((attributeName) => {
                if (Object.prototype.hasOwnProperty.call(attributes, attributeName)
                    && attributes[attributeName] !== undefined) {
                    player[attributeName] = attributes[attributeName];
                }
            });

            return player;
        }
        // ---------------- Update dom function ---------------

        function updatePlayers() {
            if (!Array.isArray(currentPlayers)) return;

            currentPlayers.forEach((player, index) => {
                const avatarEl = document.getElementById(`p${index + 1}-avatar-container`);
                const nameEl = document.getElementById(`p${index + 1}-name`);
                const chipsEl = document.getElementById(`p${index + 1}-chips`);

                if (avatarEl) {
                    avatarEl.replaceChildren();
                    if (player.avatarUrl) {
                        const avatarImage = document.createElement('img');
                        avatarImage.src = player.avatarUrl;
                        avatarImage.alt = 'Avatar';
                        avatarEl.appendChild(avatarImage);
                    }
                }
                if (nameEl) {
                    nameEl.innerText = player.username || player.clientId;
                }
                if (chipsEl) {
                    chipsEl.innerText = player.chips ?? 0;
                }
            });

            showdown();
        }

        function updateGameStatusBar() {
            let gameStartText = "No";
            let playerStatusText = "Not joined";

            if (gameStarted) {
                gameStartText = "Yes";
            }

            if (roomId) {
                playerStatusText = "Joined";
            }

            const statusValues = {
                "room-id": roomId,
                "game-start": gameStartText,
                "seat-number-display": playerNum,
                "current-turn-display": currentTurnPlayer,
                "player-status-display": playerStatusText
            };

            Object.entries(statusValues).forEach(([elementId, value]) => {
                const element = document.getElementById(elementId);
                let displayValue = value;

                if (displayValue == null) {
                    displayValue = "-";
                }

                if (element) {
                    element.textContent = displayValue;
                }
            });
        }

        function updateActionButtonsState() {
            const actionButtons = [
                document.getElementById('btn-fold'),
                document.getElementById('btn-check'),
                document.getElementById('btn-call'),
                document.getElementById('btn-bet'),
                document.getElementById('btn-raise')
            ].filter(Boolean);

            const isMyTurn = Boolean(gameStarted && currentTurnPlayer && String(currentTurnPlayer) === String(user?.id));
            const currentPlayer = currentPlayers.find((player) =>
                String(player.clientId) === String(user?.id)
            );
            const playerBet = Number(currentPlayer?.bettedChips) || 0;
            const callAmount = Math.max(0, Number(currentTurnTotalBet) - playerBet);

            const betAmount = currentTurnTotalBet > 0 ? currentTurnTotalBet : currentBet;
            const raiseAmount = Math.max(betAmount + stepAmount, currentBet + stepAmount);
            document.getElementById('call-amount').textContent = callAmount;
            document.getElementById('bet-amount-text').textContent = betAmount;
            document.getElementById('raise-amount').textContent = raiseAmount;

            actionButtons.forEach((button) => {
                button.disabled = !isMyTurn;
                button.style.opacity = isMyTurn ? '1' : '0.45';
                button.style.cursor = isMyTurn ? 'pointer' : 'not-allowed';
            });
        }

        function updatePot(value = pot) {
            pot = Number(value ?? 0);
            const potDisplay = document.getElementById('pot-display');

            if (potDisplay) {
                potDisplay.textContent = pot;
            }

            return pot;
        }

        function updateCards() {
            const communityCardsContainer = document.getElementById('community-cards');
            if (!communityCardsContainer) {
                return;
            }

            communityCards.forEach((card, index) => {
                const normalizedCard = normalizeCard(card);
                if (!normalizedCard) {
                    return;
                }

                const rankCode = normalizedCard.rank;
                const suitCode = normalizedCard.suit;
                const rank = rankCode === 'T' ? '10' : rankCode;
                const suit = {
                    H: '♥',
                    D: '♦',
                    C: '♣',
                    S: '♠'
                }[suitCode] || suitCode;
                let cardElement = communityCardsContainer.children[index];

                if (!cardElement || cardElement.tagName !== 'SPAN') {
                    cardElement = document.createElement('span');
                    cardElement.style.display = 'inline-flex';
                    cardElement.style.alignItems = 'center';
                    cardElement.style.justifyContent = 'center';
                    cardElement.style.minWidth = '42px';
                    cardElement.style.height = '60px';
                    cardElement.style.padding = '6px';
                    cardElement.style.borderRadius = '6px';
                    cardElement.style.backgroundColor = '#ffffff';
                    cardElement.style.color = '#111111';
                    cardElement.style.fontSize = '22px';
                    cardElement.style.fontWeight = 'bold';
                    communityCardsContainer.children[index]?.replaceWith(cardElement);
                    if (!cardElement.isConnected) {
                        communityCardsContainer.appendChild(cardElement);
                    }
                }

                cardElement.textContent = `${rank}${suit}`;
                cardElement.style.color = suit === '♥' || suit === '♦' ? '#d94c5d' : '#111111';
                cardElement.setAttribute('aria-label', `${rank} of ${suitCode}`);
            });

            while (communityCardsContainer.children.length > communityCards.length) {
                communityCardsContainer.lastElementChild.remove();
            }
        }

        function normalizeCard(card) {
            if (typeof card === 'string' && card.length >= 2) {
                return {
                    rank: card.slice(0, -1).toUpperCase(),
                    suit: card.slice(-1).toUpperCase()
                };
            }

            if (card && card.rank != null && card.suit != null) {
                return {
                    rank: String(card.rank).toUpperCase(),
                    suit: String(card.suit).toUpperCase()
                };
            }

            return null;
        }

        function showdown() {
            currentPlayers.forEach((player, index) => {
                const cardsContainer = document.getElementById(`p${index + 1}-showdown-cards`);
                if (!cardsContainer) {
                    return;
                }

                cardsContainer.replaceChildren();

                if (String(player.status || '').toLowerCase() === 'folded') {
                    cardsContainer.setAttribute('aria-label', 'Folded player hole cards');
                    return;
                }

                const holeCards = Array.isArray(player.holeCards)
                    ? player.holeCards
                    : [];
                cardsContainer.setAttribute(
                    'aria-label',
                    holeCards.length ? 'Player hole cards' : 'No hole cards available'
                );

                holeCards.forEach((card) => {
                    const normalizedCard = normalizeCard(card);
                    if (!normalizedCard) {
                        return;
                    }

                    const rank = normalizedCard.rank === 'T'
                        ? '10'
                        : normalizedCard.rank;
                    const suitCode = normalizedCard.suit;
                    const suit = {
                        H: '♥',
                        D: '♦',
                        C: '♣',
                        S: '♠'
                    }[suitCode] || suitCode;
                    const cardElement = document.createElement('span');

                    cardElement.textContent = `${rank}${suit}`;
                    cardElement.setAttribute('aria-label', `${rank} of ${suitCode}`);
                    cardElement.style.color = suit === '♥' || suit === '♦'
                        ? '#d94c5d'
                        : '#111111';
                    cardElement.style.fontWeight = 'bold';
                    cardElement.style.fontSize = '18px';
                    cardsContainer.appendChild(cardElement);
                });
            });
        }

        //------------- callback functions for websocket -------------

        function joinHandler(params) {
            if (!checkNoNullParams(params)) {
                return "Error joinHandler have null or undefined key value";
            }
            const success = params.success;
            roomId = params.roomId;
            roomName = params.roomName;
            playerNum = params.playerNum;
            maxPlayer = params.maxPlayer;
            currentPlayers = [];
            params.currentPlayers.forEach((player, index) => {
                let playerObject = playerConstructor(player.clientId, player.seat || (index + 1), player.username, player.money ?? player.chips ?? 0);
                currentPlayers.push(playerObject);
            });
            currentTurnPlayer = null;
            gameStarted = false;

            if (!success) {
                return "[join-result] Unsuccessful";
            }

            updatePot(params.pot ?? 0);
            generatePlayerDivs(maxPlayer);
            updateGameStatusBar();
            updatePlayers();
            updateActionButtonsState();

            return `[join-result] Joined room successfully`;
        }

        function playerJoinHandler(params) {
            if (!checkNoNullParams(params)) {
                return "Error playerJoinHandler have null or undefined key value";
            }

            // ✅ แก้ไข 1: เปลี่ยน clientId เป็น params.clientId
            if (params.clientId === user?.id) {
                return "playerJoinHandler: It's this user no need to update";
            }

            currentPlayers = [];
            params.currentPlayers.forEach((player, index) => {
                const playerObject = playerConstructor(
                    player.clientId,
                    player.seat || (index + 1), // seats
                    player.username,            // username
                    player.money ?? player.chips ?? 0,
                    player.holeCards ?? [],
                    player.status ?? '',
                    player.avatarUrl ?? ''
                );
                currentPlayers.push(playerObject);
            });

            if (params.playerNum) playerNum = params.playerNum;

            // ✅ แก้ไข 2: หาชื่อผู้เล่นอย่างถูกต้อง
            const joinedPlayer = currentPlayers.find((player) => player.clientId == params.clientId);
            const username = joinedPlayer ? joinedPlayer.username : params.clientId;

            if (params.pot !== undefined) {
                updatePot(params.pot);
            } else {
                updatePot(0);
            }
            updatePlayers();

            return `${params.clientId}:${username} joined the room`;
        }

        function startGameHandler(params) {
            tableStateHandler(params);
            gameStarted = params?.phase
                ? params.phase !== 'WAITING'
                : true;
            updateGameStatusBar();
            updateActionButtonsState();
            return gameStarted ? "Game started" : "Game not started";
        }

        function turnStartHandler(params) {
            //TODO Add timeout Function
            if (!checkNoNullParams(params)) {
                return "Error turnStartHandler have null or undefined key value";
            }
            currentTurnPlayer = params.clientId;
            updateGameStatusBar();
            updateActionButtonsState();
            return `Turn started for player ${currentTurnPlayer}`;
        }

        function gameActionHandler(params) {
            if (!params || typeof params !== 'object') {
                return "Error gameActionHandler have null or undefined key value";
            }

            const action = params.action;
            const clientId = params.clientId;
            const amount = Number(params.amount ?? 0);
            const timedOut = Boolean(params.timed_out); 

            currentTurnTotalBet = Number(params.currentBet ?? currentTurnTotalBet);

            const player = currentPlayers.find(player => player.clientId == clientId);
            if (!player) {
                return `Player ${clientId} was not found`;
            }

            if (action == "BET") {
                player.chips -= amount;
                player.bettedChips += amount;
            }
            else if (action == "CHECK") {
                // may Add animation
            }
            else if (action == "RAISE") {
                player.chips -= amount;
                player.bettedChips += amount;
            }
            else if (action == "CALL") {
                player.chips -= amount;
                player.bettedChips += amount;
            }
            else if (action == "FOLD") {
                player.status = "FOLDED";
            }
            else {
                console.log("Unknown game action : " + action);
            }

            currentTurnTotalBet = Number(params.currentBet ?? currentTurnTotalBet);

            updatePot(params.pot);
            updatePlayers();

            console.log(`[game-action] ${clientId} ${action} amount=${amount}`);
            return {
                clientId,
                action,
                amount,
                timed_out: timedOut,
                pot: pot,
                currentBet: currentTurnTotalBet
            };
        }

        function dealCardsHandler(params) {
            // WARNING: Deferred finding 4. Do not normalize raw deal-card codes here.
            if (!checkNoNullParams(params)) {
                return "Error dealCardsHandler have null or undefined key value";
            }
            // Deal the community card that is send from the server and display on ther table
            const cards = Array.isArray(params.card) ? params.card : [params.card];
            cards.forEach((card) => {
                if (normalizeCard(card)) {
                    communityCards.push(card);
                }
            });
            updateCards();
            return `${cards.length} community card(s) dealt`;
        }

        function winnerHandler(params) {
            // show winner and update players money
            if (!params || typeof params !== 'object') {
                return "Error winnerHandler have null or undefined key value";
            }
            const winnerId = params.winnerId ?? params.winner;
            const currentMoney = params.current_money ?? params.currentMoney;

            if (Array.isArray(currentMoney)) {
                currentMoney.forEach((client) => {
                    const player = currentPlayers.find((item) =>
                        String(item.clientId) === String(client.clientId)
                    );
                    if (player) {
                        player.chips = Number(client.money ?? client.chips);
                        player.bettedChips = 0;
                        player.holeCards = [];
                        player.status = "";
                    }
                });
            } else {
                const winner = currentPlayers.find((player) =>
                    String(player.clientId) === String(winnerId)
                );
                if (winner && Number.isFinite(Number(currentMoney))) {
                    winner.chips = Number(currentMoney);
                    winner.bettedChips = 0;
                }
            }

            updatePlayers();
            updatePot(0);
            gameStarted = false;
            currentTurnPlayer = null;
            updateGameStatusBar();
            updateActionButtonsState();
            generateWinnerNotification(winnerId);
            return;
        }

        function tournamentFinishedHandler(params) {
            tableStateHandler(params);
            gameStarted = false;
            currentTurnPlayer = null;
            updateGameStatusBar();
            updateActionButtonsState();
            generateWinnerNotification(`${params?.winner_name || params?.winner || 'Unknown'} is the last player standing`);
            return `Tournament finished: ${params?.winner_name || params?.winner || 'Unknown'} is the last player standing`;
        }

        function errorHandler(errorMessage) {
            const message = typeof errorMessage === 'string'
                ? errorMessage
                : errorMessage?.error || errorMessage?.message || 'Unknown server error';
            showGameNotice(message, true);
            return `Server sent error: ${message}`;
        }

        function showGameNotice(message, isError = false) {
            const noticeId = 'game-notice';
            document.getElementById(noticeId)?.remove();

            const notice = document.createElement('div');
            notice.id = noticeId;
            notice.textContent = message;
            Object.assign(notice.style, {
                position: 'fixed',
                top: '24px',
                left: '50%',
                transform: 'translateX(-50%)',
                zIndex: '1001',
                maxWidth: 'min(90vw, 520px)',
                padding: '12px 18px',
                borderRadius: '8px',
                backgroundColor: isError ? '#8f263a' : '#236d53',
                color: '#ffffff',
                fontWeight: 'bold',
                textAlign: 'center'
            });
            document.body.appendChild(notice);
            window.setTimeout(() => notice.remove(), 3500);
        }

        function leftRoomHandler(params) {
            if (!checkNoNullParams(params)) {
                return "Error leftRoomHandler have null or undefined key value";
            }
            const leavingClientId = params.clientId;
            const leavingPlayerNum = params.playerNum ?? currentPlayers.length;
            const remainingPlayers = params.currentPlayers || [];

            if (String(leavingClientId) === String(user?.id)) {
                const roomCode = params?.room_code || roomId;

                roomId = null;
                roomName = null;
                playerNum = null;
                maxPlayer = null;
                currentPlayers = [];
                gameStarted = false;
                currentTurnPlayer = null;
                pot = 0;
                updatePot(0);

                if (socket) {
                    socket.close();
                    socket = null;
                }

                document.getElementById("room-code-input").value = "";
                generatePlayerDivs();
                updatePlayers();
                updateGameStatusBar();
                updateActionButtonsState();

                return `[left-room] Left room ${roomCode}`;
            }

            currentPlayers = remainingPlayers.map((player, index) =>
                playerConstructor(
                    player.clientId,
                    player.seat || (index + 1),
                    player.username,
                    player.money
                )
            );
            playerNum = leavingPlayerNum;
            currentTurnPlayer = null;
            updatePot(0);
            generatePlayerDivs(maxPlayer || currentPlayers.length || 4);
            updatePlayers();
            updateGameStatusBar();
            updateActionButtonsState();

            return `[left-room] ${leavingClientId} left the room`;
        }

        function tableStateHandler(params) {
            if (!params || typeof params !== 'object') {
                return "Error tableStateHandler have null or undefined key value";
            }
            roomId = params.room_code
            roomName = params.room_name;
            playerNum = params.player_count;
            maxPlayer = params.max_players;
            hostId = params.host_id;
            currentTurnPlayer = params.current_turn;
            turnDeadline = params.turn_deadline;
            pot = params.pot;
            currentTurnTotalBet = params.current_bet;
            communityCards = Array.isArray(params.community_cards)
                ? params.community_cards
                : [];
            // WARNING: Deferred finding 9. Join and table-state payloads intentionally
            // retain different camelCase and snake_case field conventions.
            const playerToBeAdded = [];
            const players = Array.isArray(params.players) ? params.players : [];
            players.forEach((paramplayer) => {
                const selectedPlayer = currentPlayers.find((player) =>
                    String(player.clientId) === String(paramplayer.client_id)
                );
                if (selectedPlayer === undefined) {
                    const newPlayer = playerConstructor(
                        paramplayer.client_id,
                        paramplayer.seat,
                        paramplayer.username,
                        paramplayer.chips,
                        paramplayer.hole_cards,
                        paramplayer.status,
                        paramplayer.avatar_id
                    );
                    playerToBeAdded.push(newPlayer);
                }
                else {
                    const attributes = {
                        clientId: paramplayer.client_id,
                        avatarUrl: paramplayer.avatar_id, 
                        seat: paramplayer.seat,
                        username: paramplayer.username,
                        chips: paramplayer.chips,
                        holeCards: paramplayer.hole_cards,
                        status: paramplayer.status
                    };
                    setPlayerObjectAttributes(selectedPlayer, attributes)
                }
            });
            playerToBeAdded.forEach((player) => currentPlayers.push(player));

            updatePlayers();
            updateActionButtonsState();
            updateCards();
            updatePot();
            updateGameStatusBar();
            return `Table state updated for room ${roomId || 'unknown'}`;
        }

        function showdownHandler(params) {
            if (!params || typeof params !== 'object') {
                return "Error showdownHandler received invalid parameters";
            }
            tableStateHandler(params);
            showdown();
            gameStarted = false;
            currentTurnPlayer = null;
            updateGameStatusBar();
            updateActionButtonsState();

            const winnerIds = Array.isArray(params.winnerIds)
                ? params.winnerIds
                : [];
            if (winnerIds.length > 1) {
                const names = currentPlayers
                    .filter((player) => winnerIds.some((id) => String(id) === String(player.clientId)))
                    .map((player) => player.username || player.clientId)
                    .join(' & ');
                generateWinnerNotification(`Split pot: ${names || winnerIds.join(' & ')}`);
            }
            return `Showdown complete: ${params.winningHand || 'hand resolved'}`;
        }

        function connection(params) {
            const msg = params?.message || "WebSocket connection established";
            return `[connection] ${msg}`;
        }

        // ✅ แก้ไข 3: อ้างอิงฟังก์ชันตรงๆ โดยไม่ใช้ () =>
        const TYPE_LOOKUP = {
            "join": joinHandler,
            "web_socket": () => "web_socket not implemented",
            "player-join": playerJoinHandler,
            "start-game": startGameHandler,
            "turn-start": turnStartHandler,
            "game-action": gameActionHandler,
            "deal-flop": dealCardsHandler,
            "deal-turn": dealCardsHandler,
            "deal-river": dealCardsHandler,
            "winner": winnerHandler,
            "error": errorHandler,
            "left-room": leftRoomHandler,
            "left_room": leftRoomHandler,
            "table-state": tableStateHandler,
            "table_state": tableStateHandler,
            "game-started": startGameHandler,
            "game_started": startGameHandler,
            "showdown": showdownHandler,
            "tournament_finished": tournamentFinishedHandler,
            "connection": connection
        };

        function handleSocketMessage(event) {
            try {
                const message = JSON.parse(event.data);
                const messageType = message.type;
                const handler = TYPE_LOOKUP[messageType];
                console.log("-------------------------------");
                console.log(message);

                if (!handler) {
                    throw new Error(`Unsupported message type: ${messageType}`);
                }
                
                console.log(handler(message.params ?? message));
                console.log("-------------------------------");
            } catch (error) {
                console.error("Failed to handle WebSocket message:", error.message);
            }
        }


        // Buttons callback Function
        async function joinRoom() {
            const roomCode = document.getElementById("room-code-input").value.trim();
            const clientId = user?.id;
            const joinButton = document.getElementById("join-room-button");

            if (!roomCode || !clientId) {
                console.error("A room code and a logged-in user are required to join a room.");
                return;
            }

            updateActionButtonsState();
            joinButton.disabled = true;
            let userBuyIn;

            try {
                userBuyIn = await refreshAccountBalance();
                if (!Number.isFinite(userBuyIn) || userBuyIn <= 0) {
                    throw new Error('Your account has no chips available.');
                }
            } catch (error) {
                console.error(error);
                showGameNotice(error.message, true);
                joinButton.disabled = false;
                return;
            }

            const wsBase = window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
            socket = new WebSocket(`${wsBase}://${window.location.hostname}:4000/ws?token=${encodeURIComponent(token)}`);

            socket.addEventListener("open", () => {
                console.log("Connected to the server!");
                socket.send(JSON.stringify({
                    type: "join",
                    params: {
                        roomCode,
                        clientId,
                        buyIn: userBuyIn
                    }
                }));
            });

            socket.addEventListener("message", handleSocketMessage);
            socket.addEventListener("error", (error) => {
                console.error("WebSocket connection failed:", error);
                joinButton.disabled = false;
            });
            socket.addEventListener("close", () => {
                joinButton.disabled = false;
            });
        }

        function leaveRoom() {
            if (!socket || !roomId) {
                console.warn("No active room to leave.");
                return;
            }

            socket.send(JSON.stringify({
                type: "leave-room",
                params: {
                    roomCode: roomId,
                    clientId: user?.id
                }
            }));
        }

        function startGame() {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                console.warn("A connected room is required to start the game.");
                return;
            }

            socket.send(JSON.stringify({
                type: "start-game"
            }));
        }

        // Event Listeners
        document.getElementById("join-room-button").addEventListener("click", joinRoom);
        document.getElementById("leave-room-button").addEventListener("click", leaveRoom);
        document.getElementById("start-game-button").addEventListener("click", startGame);

        document.getElementById('btn-fold').addEventListener('click', () => onActionClick('FOLD'));
        document.getElementById('btn-check').addEventListener('click', () => onActionClick('CHECK'));
        document.getElementById('btn-call').addEventListener('click', () => {
            const amount = document.getElementById('call-amount').textContent;
            onActionClick('CALL', amount);
        });
        document.getElementById('btn-bet').addEventListener('click', () => {
            const amount = document.getElementById('bet-amount-text').textContent;
            onActionClick('BET', amount);
        });
        document.getElementById('btn-raise').addEventListener('click', () => {
            const amount = document.getElementById('raise-amount').textContent;
            onActionClick('RAISE', amount);
        });

        document.getElementById('btn-minus').addEventListener('click', () => onBetAdjustClick('MINUS'));
        document.getElementById('btn-plus').addEventListener('click', () => onBetAdjustClick('PLUS'));

        function onActionClick(actionType, amount = null) {
            console.log(`Action Executed: ${actionType}`, amount ? `Amount: ${amount}` : '');
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                console.warn("A connected room is required to perform a game action.");
                return;
            }

            const payload = {
                    type: "game-action",
                    params: {
                        action: actionType,
                        amount: amount
                    }
            };
            socket.send(JSON.stringify(payload));
        }

        function onBetAdjustClick(type) {
            if (type === 'PLUS') {
                currentBet += stepAmount;
            } else if (type === 'MINUS') {
                currentBet = Math.max(0, currentBet - stepAmount);
            }

            document.getElementById('bet-value').textContent = currentBet;
            document.getElementById('bet-amount-text').textContent = currentBet;
            document.getElementById('raise-amount').textContent = currentBet;
        }

    </script>
</body>
